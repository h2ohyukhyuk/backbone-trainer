# All training defaults are defined here, not in main.py.
# python main.py automatically loads this file from the experiments directory.
# --config_path selects an experiment YAML whose values override these defaults.
# data/save/resume paths are relative to the current working directory.

# Dataset and model
dataset: image_net_1K         # image_net_1K or cifar10
data: /home/j/database/ImageNet1K
input_size: 224              # CIFAR-10 experiments can use the native size 32
download: false              # Download missing CIFAR-10 files when true
arch: resnet18                # torchvision name or net/<arch>.py:Network
model_kwargs: {}              # num_classes is automatically selected for the dataset
pretrained: false             # torchvision weights; custom models use resume
dummy: false                 # Use FakeData with the selected dataset's sizes/classes

# Training augmentation (validation transforms are deterministic and unchanged).
# These defaults preserve the previous ImageNet/CIFAR-10 training behavior.
AUGMENTATION:
  image_net_1K:
    crop_scale: [0.08, 1.0]        # RandomResizedCrop area fraction
    crop_ratio: [0.75, 1.3333333333333333]
    horizontal_flip_p: 0.5        # 0 disables flipping
    randaugment_enabled: true
    randaugment_num_ops: 2
    randaugment_magnitude: 9      # Integer in [0, num_magnitude_bins-1]
    randaugment_num_magnitude_bins: 31
    random_erasing_p: 0.1         # 0 disables RandomErasing
    random_erasing_scale: [0.02, 0.33]
    random_erasing_ratio: [0.3, 3.3]
    random_erasing_value: 0       # Number or 'random'; applied after normalization
  cifar10:
    random_crop_enabled: true    # Native 32x32 crop before resize to input_size
    crop_padding: 4
    horizontal_flip_p: 0.5
    randaugment_enabled: false
    randaugment_num_ops: 2
    randaugment_magnitude: 9
    randaugment_num_magnitude_bins: 31
    random_erasing_p: 0.0
    random_erasing_scale: [0.02, 0.33]
    random_erasing_ratio: [0.3, 3.3]
    random_erasing_value: 0
  batch:
    datasets: [image_net_1K]      # Add cifar10 to enable there; [] disables both
    p: 0.1                      # Probability to apply ONE of MixUp/CutMix; 0 disables
    mixup_alpha: 0.8
    cutmix_alpha: 1.0
    mixup_weight: 0.5            # Conditional MixUp probability; CutMix gets 1-weight

# Data loading and training
workers: 4                   # Worker count per node
epochs: 90
fast_mode: false            # One training batch per epoch, then full validation
start_epoch: 0
batch_size: 256               # Total per node; divided among local DDP processes

# NVIDIA mixed precision (CPU automatically uses float32)
amp: true
amp_dtype: float16           # float16 uses GradScaler; bfloat16 requires GPU support

# Optimizer selection and common settings (original get_optimizer variable names)
OPT_NAME: adamw               # sgd | adam | adamw | rmsprop | adadelta
LR: 0.01                   # Base LR for every optimizer and scheduler
WEIGHT_DECAY: 0.0001        # Common weight decay; AdamW uses decoupled weight decay

# Parameter-group LR multipliers (all optimizers)
USE_LR_MULT: false
LR_MULT_TARGET: []          # Top-level module name keywords, e.g. [classifier]
LR_MULT_VAL: []             # Matching positive multipliers, e.g. [10.0]

# --- SGD / RMSprop: shared momentum ---
MOMENTUM: 0.9              # Used only by SGD and RMSprop

# --- SGD only ---
SGD_KWARGS:
  dampening: 0
  nesterov: false

# --- Adam / AdamW: shared AMSGrad switch ---
AMS_GRAD: false            # Used only by Adam and AdamW

# --- Adam only ---
ADAM_KWARGS:
  betas: [0.9, 0.999]
  eps: 1.0e-8

# --- AdamW only ---
ADAMW_KWARGS:
  betas: [0.9, 0.999]
  eps: 1.0e-8

# --- RMSprop only (also uses MOMENTUM above) ---
RMSPROP_KWARGS:
  alpha: 0.99
  eps: 1.0e-8
  centered: false

# --- Adadelta only ---
ADADELTA_KWARGS:
  rho: 0.9
  eps: 1.0e-6

# Scheduler selection: edit only the matching section below.
lr_scheduler: lambdalr       # steplr | lambdalr | multisteplr | polylr

# --- StepLR: epoch-based staircase decay ---
STEPLR_KWARGS:
  step_size: 10             # Decay every N completed epochs
  gamma: 0.5               # Multiply LR by this factor

# --- LambdaLR: epoch/LR keyframe interpolation (per optimizer update) ---
LAMBDALR_KWARGS:
  scale: 0.95               # Multiply every point LR and the whole interpolated curve
  points:                  # Completed epoch: absolute LR (fractional epochs supported)
    0: 0.0001
    2: 0.01
    15: 0.007
    20: 0.007
    43: 0.002
    48: 0.002
    70: 0.0003
    90: 0.00001
  interpolation: hermite   # Hermite only

# --- MultiStepLR: decay at specified epoch milestones ---
MULTISTEPLR_KWARGS:
  milestones: [30, 60, 80] # Completed epoch numbers at which LR decays
  gamma: 0.1               # Multiply LR at each milestone

# --- PolyLR: polynomial decay over all epochs (no warmup) ---
POLYLR_KWARGS:
  power: 0.85               # LR * (1 - completed_epochs / epochs) ** power; ends at zero

seed: 1024                   # Integer for deterministic training, or null
print_freq: 200

# Checkpoints and evaluation
save: /home/j/models_cla/     # LOCAL runs only; ignored by ClearML remote runs
resume_task_id: ''            # Previous ClearML task ID; restores its last.pt config and training state
resume: ''                   # Checkpoint path; empty string starts fresh
evaluate: false              # Run validation only

# Devices and distributed training
gpu: null                    # Fixed GPU ID, or null for automatic selection
no_accel: false              # true forces CPU
num_nodes: 1                # Number of servers (never the GPU/process count)
node_rank: 0                # This server index: 0 .. num_nodes-1
dist_url: tcp://224.66.41.62:23456
dist_backend: nccl           # Use gloo for CPU DDP
multiprocessing_distributed: false

# torchrun supplies global/local ranks and process counts through environment variables.
# For the original spawn launch, set multiprocessing_distributed: true,
# num_nodes: 1, node_rank: 0, gpu: null, dist_url: tcp://127.0.0.1:29500,
# then run python main.py (or select an experiment with --config_path).
