# Only differences from config_default.yaml are needed here.
# Edit any training setting in YAML; the CLI only selects this file.
arch: APAGNet                  # net/APAGNet.py:Network(); the alias apag also works

# Start one process per visible GPU when invoked as python main.py by ClearML.
multiprocessing_distributed: true
num_nodes: 1
node_rank: 0

dist_url: tcp://127.0.0.1:29500
batch_size: 768              # Two GPUs: 384 per GPU
workers: 12                 # Per node; 6 DataLoader workers per GPU with two GPUs

# Auto-spawn DDP on all visible GPUs:
# python main.py --config_path experiments/config.yml
# With torchrun, override multiprocessing_distributed: false in the experiment YAML.
